name: GEO Monitor

# Runs the AI Nexus GEO Monitor (technical audit + AI citation testing) on a
# schedule, commits the report into the repo under scripts/geo-monitor/reports/,
# and also uploads it as a workflow artifact for quick download.
#
# Setup required (one-time):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#   Add whichever of these you have (all optional — the monitor skips any
#   engine whose key is missing, and the technical audit needs none of them):
#     ANTHROPIC_API_KEY
#     OPENAI_API_KEY
#     PERPLEXITY_API_KEY
#     GOOGLE_API_KEY
#
# Manual run: Actions tab → GEO Monitor → Run workflow.

on:
  schedule:
    # 06:00 UTC on the 1st and 15th of every month — twice-monthly is plenty
    # for tracking citation-rate trend without burning API budget.
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    inputs:
      query_limit:
        description: 'Max number of queries to test against AI engines (0 = all)'
        required: false
        default: '60'

permissions:
  contents: write

jobs:
  geo-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate GEO test queries from site content
        run: node scripts/geo-monitor/generate-queries.mjs

      - name: Run technical GEO audit (live site)
        run: node scripts/geo-monitor/technical-audit.mjs --base-url https://ainexustools.online

      - name: Run AI citation tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.query_limit || '60' }}"
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$PERPLEXITY_API_KEY" ] && [ -z "$GOOGLE_API_KEY" ]; then
            echo "No AI engine API keys configured — skipping citation testing. Technical audit will still be reported."
            echo "Add ANTHROPIC_API_KEY / OPENAI_API_KEY / PERPLEXITY_API_KEY / GOOGLE_API_KEY as repo secrets to enable this step."
          else
            node scripts/geo-monitor/citation-test.mjs --limit "$LIMIT"
          fi

      - name: Generate combined report
        run: node scripts/geo-monitor/generate-report.mjs

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-report
          path: scripts/geo-monitor/reports/
          retention-days: 90

      - name: Commit report to repo
        run: |
          git config user.name "geo-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/geo-monitor/reports/ scripts/geo-monitor/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(geo-monitor): update GEO report [skip ci]"
            git push
          fi
