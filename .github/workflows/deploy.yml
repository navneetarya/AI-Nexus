name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Opt all actions into the Node.js 24 runner now, before GitHub forces it on
# June 2 2026 (avoids the Node 20 deprecation failures on checkout/setup-node).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22        # Node 22 is current LTS; matches @types/node ^22 in package.json
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build + Pre-render all routes
        # vite build compiles the React app, then scripts/prerender.mjs
        # creates dist/<route>/index.html for every URL in the sitemap.
        # This ensures GitHub Pages returns HTTP 200 (not 404) for all pages,
        # making them crawlable by Google, Bing, and AI answer engines.
        run: npm run build

      - name: Validate prerender output
        # Task 27: Ensure all routes are prerendered, schemas injected,
        # sitemap generated, and no regressions before deploying.
        run: |
          echo "── Prerender Validation ──"

          # 1. Check critical prerendered pages exist
          MISSING=0
          for slug in grammarly writesonic rytr quillbot frase leonardo-ai photoroom looka pictory opus-clip invideo murf-ai podcastle gamma beautiful-ai ocoya replit notion-ai taskade elevenlabs jasper descript perplexity canva-ai; do
            if [ ! -f "dist/tools/$slug/index.html" ]; then
              echo "❌ Missing: dist/tools/$slug/index.html"
              MISSING=$((MISSING+1))
            fi
          done

          for slug in best-ai-writing-tools-for-beginners-2026 best-ai-tools-for-freelancers-2026 best-grammarly-alternatives best-podcastle-alternatives best-ai-tools-for-social-media-2026 how-to-use-rytr-to-write-blog-posts ai-tools-for-students-free-2026 best-ai-podcast-tools-2026 jasper-ai-alternatives chatgpt-alternatives-free-2026 best-ai-coding-tools-2026 best-ai-logo-makers-free-2026 best-ai-marketing-tools-2026 ai-tools-for-teachers-2026 best-midjourney-alternatives-2026 best-notion-ai-alternatives-2026 best-invideo-alternatives-2026 how-to-use-ai-for-content-creation-2026 best-ai-tools-in-india-2026 grok-4-vs-chatgpt-vs-claude-content-creators-2026; do
            if [ ! -f "dist/blog/$slug/index.html" ]; then
              echo "❌ Missing: dist/blog/$slug/index.html"
              MISSING=$((MISSING+1))
            fi
          done

          for slug in rytr-vs-writesonic grammarly-vs-quillbot podcastle-vs-descript; do
            if [ ! -f "dist/compare/$slug/index.html" ]; then
              echo "❌ Missing: dist/compare/$slug/index.html"
              MISSING=$((MISSING+1))
            fi
          done

          for slug in best-ai-writing-tools best-ai-image-tools best-ai-video-tools best-ai-audio-tools best-ai-marketing-tools best-ai-design-tools best-ai-coding-tools best-ai-productivity-tools; do
            if [ ! -f "dist/$slug/index.html" ]; then
              echo "❌ Missing: dist/$slug/index.html"
              MISSING=$((MISSING+1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "❌ $MISSING prerendered pages missing — aborting deploy"
            exit 1
          fi
          echo "✅ All expected prerendered pages exist"

          # 2. Verify schemas in tool pages
          if ! grep -q "BreadcrumbList" dist/tools/rytr/index.html; then
            echo "❌ BreadcrumbList schema missing from tool pages"
            exit 1
          fi
          echo "✅ BreadcrumbList schema present"

          if ! grep -q '"@type":"Review"\|"@type": "Review"' dist/tools/rytr/index.html; then
            echo "❌ Review schema missing from tool pages"
            exit 1
          fi
          echo "✅ Review schema present"

          # 3. Check sitemap and RSS
          if [ ! -f "dist/sitemap.xml" ]; then
            echo "❌ sitemap.xml not generated"
            exit 1
          fi
          echo "✅ sitemap.xml generated"

          if [ ! -f "dist/rss.xml" ]; then
            echo "❌ rss.xml not generated"
            exit 1
          fi
          echo "✅ rss.xml generated"

          # 4. Check homepage FAQPage schema
          if ! grep -q "FAQPage" dist/index.html; then
            echo "❌ FAQPage schema missing from homepage"
            exit 1
          fi
          echo "✅ Homepage FAQPage schema present"

          # 5. Check minimum page count
          COUNT=$(find dist -name "index.html" | wc -l)
          echo "ℹ️  Built $COUNT pages"
          if [ "$COUNT" -lt 40 ]; then
            echo "❌ Too few pages built ($COUNT) — expected 40+"
            exit 1
          fi
          echo "✅ Page count OK: $COUNT pages"

          # 6. Bundle size guard (warn > 800KB total JS)
          TOTAL_JS=$(find dist/assets -name "*.js" -exec stat --format="%s" {} + 2>/dev/null | awk '{s+=$1}END{print int(s/1024)}')
          echo "ℹ️  Total JS bundle: ${TOTAL_JS}KB"
          if [ "$TOTAL_JS" -gt 800 ]; then
            echo "⚠️  JS bundle exceeds 800KB — investigate code splitting"
          fi

          echo "── Prerender validation passed ✅ ──"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Google and Bing of sitemap update
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://ainexustools.online/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://ainexustools.online/sitemap.xml" || true

  ping-search-engines:
    # Notify Google and Bing about sitemap updates after every deploy
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Ping Google
        run: |
          curl -sf "https://www.google.com/ping?sitemap=https://ainexustools.online/sitemap.xml" \
            && echo "Google pinged ✓" || echo "Google ping failed (non-fatal)"

      - name: Ping Bing
        run: |
          curl -sf "https://www.bing.com/ping?sitemap=https://ainexustools.online/sitemap.xml" \
            && echo "Bing pinged ✓" || echo "Bing ping failed (non-fatal)"

      - name: Ping IndexNow
        run: |
          curl -sf -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"ainexustools.online","key":"c77b73bf52984321a0009ddd249c0a20","urlList":["https://ainexustools.online/sitemap.xml"]}' \
            && echo "IndexNow pinged ✓" || echo "IndexNow ping failed (non-fatal)"
