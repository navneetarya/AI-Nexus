name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Opt all actions into the Node.js 24 runner now, before GitHub forces it on
# June 2 2026 (avoids the Node 20 deprecation failures on checkout/setup-node).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22        # Node 22 is current LTS; matches @types/node ^22 in package.json
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build + Pre-render all routes
        # vite build compiles the React app, then scripts/prerender.mjs
        # creates dist/<route>/index.html for every URL in the sitemap.
        # This ensures GitHub Pages returns HTTP 200 (not 404) for all pages,
        # making them crawlable by Google, Bing, and AI answer engines.
        run: npm run build

      - name: Validate prerender output
        # Task 27: Ensure all routes are prerendered, schemas injected,
        # sitemap generated, and no regressions before deploying.
        run: |
          echo "── Prerender Validation ──"

          # 1. Check critical prerendered pages exist
          MISSING=0
          for slug in grammarly writesonic rytr quillbot frase leonardo-ai photoroom looka pictory opus-clip invideo murf-ai podcastle gamma beautiful-ai ocoya replit notion-ai taskade elevenlabs jasper descript perplexity canva-ai cursor lovable emergent chatgpt claude-ai grok-ai midjourney stable-diffusion windsurf github-copilot v0 headshotpro getresponse munch basedlabs narrato fireflies bolt claude-code nano-banana-pro; do
            if [ ! -f "dist/tools/$slug/index.html" ]; then
              echo "❌ Missing: dist/tools/$slug/index.html"
              MISSING=$((MISSING+1))
            fi
          done

          # 1b. Blog slug list — kept in sync with blog/*.ts via the count
          # check below.
          #
          # PROCESS — when publishing a new blog post:
          #   1. Add the post's .ts file to blog/ (as usual).
          #   2. Add its slug to the BLOG_SLUGS array immediately below
          #      (alphabetical order, matching the filename without .ts).
          #   3. If the new post adds a new route to sitemap.xml, bump the
          #      "Sitemap URL count" check further down in this file.
          # The sync check below will fail the build with a reminder if a
          # post is added to blog/ without a matching entry here.
          BLOG_SLUGS=(
            best-ai-website-builders-2026
            best-ai-sales-tools-for-founders-2026
            best-ai-receptionist-small-business-2026
            best-ai-photo-upscaler-tools-2026
            best-ai-ad-creative-generator-tools-2026
            best-nano-banana-pro-alternatives-2026
            best-ai-voice-agent-small-business-2026
            chatgpt-atlas-vs-perplexity-comet-vs-dia-2026
            best-ai-resume-builder-tools-2026
            ai-agents-vs-ai-automation-difference-2026
            ai-api-pricing-comparison-2026 ai-contract-analysis-tools-2026 ai-ecosystem-growth-report-2026 ai-tools-for-students-free-2026 ai-tools-for-teachers-2026
            emergent-ai-explained-2026
            best-ai-voice-dictation-tools-2026
            ai-tools-cost-roi-calculator-2026
            ai-tools-for-solopreneurs-2026
            best-ai-agents-customer-service-2026
            best-ai-agents-for-small-business-2026 best-ai-chatbot-2026 best-ai-coding-agents-2026 best-ai-coding-tools-2026 best-ai-email-marketing-tools-2026 best-ai-headshot-tools-linkedin-2026
            best-ai-logo-makers-free-2026 best-ai-marketing-tools-2026 best-ai-meeting-tools-2026 best-ai-podcast-tools-2026
            best-ai-presentation-tools-2026
            best-ai-tools-for-automation-engineers-2026 best-ai-tools-for-content-creators-free-2026 best-ai-tools-for-developers-2026
            best-ai-tools-for-freelancers-2026 best-ai-tools-for-freelancers-india-2026 best-ai-tools-for-social-media-2026
            best-ai-tools-for-startups-2026 best-ai-tools-for-youtube-creators-2026 best-ai-tools-for-youtubers-2026
            best-ai-tools-in-india-2026 best-ai-video-generators-2026 best-ai-writing-tools-2026 best-ai-writing-tools-for-beginners-2026
            best-free-ai-tool-plans-2026 best-free-ai-tools-for-students-in-india-2026 best-free-ai-writing-tools-2026
            best-grammarly-alternatives best-invideo-alternatives-2026 best-midjourney-alternatives-2026 best-no-code-ai-automation-tools-2026 best-notion-ai-alternatives-2026
            best-podcastle-alternatives best-vibe-coding-tools-2026 best-ai-recruitment-tools-2026 chatgpt-alternatives-free-2026
            chatgpt-free-vs-claude-free-vs-gemini-free-2026 cheapest-ai-coding-tools-2026 claude-code-alternatives-2026 claude-code-vs-github-copilot-vs-replit-2026
            cursor-ai-review-2026 fastest-growing-ai-startups-2026 google-gemini-ai-review-2026
            gpt-5-5-vs-claude-opus-4-8-vs-grok-4-2026 grok-4-vs-chatgpt-vs-claude-content-creators-2026
            how-to-use-ai-for-content-creation-2026 how-to-use-rytr-to-write-blog-posts is-grammarly-premium-worth-it-2026
            jasper-ai-alternatives leonardo-vs-midjourney-2026 llm-api-pricing-comparison-2026 multi-agent-ai-systems-explained-2026 n8n-vs-make-vs-zapier-2026 perplexity-ai-review-2026
            perplexity-pro-vs-chatgpt-plus-vs-claude-pro-freelancers-2026 relevance-ai-vs-lindy-vs-gumloop-2026 taskade-vs-notion-vs-asana-2026
            what-is-mcp-model-context-protocol-2026
          )

          # Sync check — fails if blog post files were added/removed without
          # updating BLOG_SLUGS above.
          # Exclude non-post helper modules kept in blog/.
          ACTUAL_COUNT=$(find blog -maxdepth 1 -name "*.ts" ! -name "index.ts" ! -name "types.ts" ! -name "loaders.ts" ! -name "metadata.ts" | wc -l)
          EXPECTED_COUNT=${#BLOG_SLUGS[@]}
          echo "ℹ️  blog/ has $ACTUAL_COUNT post files; BLOG_SLUGS lists $EXPECTED_COUNT slugs"
          if [ "$ACTUAL_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "❌ blog/ contains $ACTUAL_COUNT post files but BLOG_SLUGS lists $EXPECTED_COUNT."
            echo "   A blog post was added or removed without updating deploy.yml."
            echo "   → Fix: edit .github/workflows/deploy.yml → 'Validate prerender"
            echo "     output' step → add/remove the slug in the BLOG_SLUGS array,"
            echo "     and update the sitemap <loc> count check if the total"
            echo "     page count changed."
            exit 1
          fi
          echo "✅ BLOG_SLUGS list is in sync with blog/ ($ACTUAL_COUNT posts)"

          for slug in "${BLOG_SLUGS[@]}"; do
            if [ ! -f "dist/blog/$slug/index.html" ]; then
              echo "❌ Missing: dist/blog/$slug/index.html"
              MISSING=$((MISSING+1))
            fi
          done

          for slug in rytr-vs-writesonic grammarly-vs-quillbot podcastle-vs-descript; do
            if [ ! -f "dist/compare/$slug/index.html" ]; then
              echo "❌ Missing: dist/compare/$slug/index.html"
              MISSING=$((MISSING+1))
            fi
          done

          for slug in best-ai-writing-tools best-ai-image-tools best-ai-video-tools best-ai-audio-tools best-ai-marketing-tools best-ai-design-tools best-ai-coding-tools best-ai-productivity-tools; do
            if [ ! -f "dist/$slug/index.html" ]; then
              echo "❌ Missing: dist/$slug/index.html"
              MISSING=$((MISSING+1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "❌ $MISSING prerendered pages missing — aborting deploy"
            exit 1
          fi
          echo "✅ All expected prerendered pages exist"

          # 2. Verify schemas in tool pages
          if ! grep -q "BreadcrumbList" dist/tools/rytr/index.html; then
            echo "❌ BreadcrumbList schema missing from tool pages"
            exit 1
          fi
          echo "✅ BreadcrumbList schema present"

          if ! grep -q '"@type":"Review"\|"@type": "Review"' dist/tools/rytr/index.html; then
            echo "❌ Review schema missing from tool pages"
            exit 1
          fi
          echo "✅ Review schema present"

          # 3. Check sitemap and RSS
          if [ ! -f "dist/sitemap.xml" ]; then
            echo "❌ sitemap.xml not generated"
            exit 1
          fi
          echo "✅ sitemap.xml generated"

          if [ ! -f "dist/rss.xml" ]; then
            echo "❌ rss.xml not generated"
            exit 1
          fi
          echo "✅ rss.xml generated"

          # 3b. Sitemap URL count — catches silent drops (missing posts/tools/etc.)
          LOC_COUNT=$(grep -c "<loc>" dist/sitemap.xml)
          echo "ℹ️  sitemap.xml contains $LOC_COUNT <loc> entries"
          # Some prerendered routes are intentionally excluded from the sitemap:
          # - /tools/ is a utility index used for navigation, not an SEO target.
          # - /best-ai-tools-for-freelancers/ is an internal route alias not meant to be indexed separately.
          ROUTE_COUNT=$(find dist -type f -name index.html \
            ! -path 'dist/tools/index.html' \
            ! -path 'dist/best-ai-tools-for-freelancers/index.html' | wc -l | tr -d ' ')
          echo "ℹ️  dist contains $ROUTE_COUNT sitemap-eligible prerendered route index files"
          if [ "$LOC_COUNT" -ne "$ROUTE_COUNT" ]; then
            echo "❌ sitemap.xml URL count ($LOC_COUNT) does not match prerendered route count ($ROUTE_COUNT)"
            echo "   Regenerate prerender output or inspect sitemap generation for dropped/extra routes."
            exit 1
          fi
          echo "✅ Sitemap URL count matches sitemap-eligible prerendered route count: $ROUTE_COUNT"

          # 4. Check homepage FAQPage schema
          if ! grep -q "FAQPage" dist/index.html; then
            echo "❌ FAQPage schema missing from homepage"
            exit 1
          fi
          echo "✅ Homepage FAQPage schema present"

          # 4b. GEO Task 4: check homepage BreadcrumbList schema — mirrors the
          # tool-page BreadcrumbList check above (step 2). Standalone
          # top-level BreadcrumbList was added (not just nested inside
          # WebPage.breadcrumb) so scanners that read only top-level "@type"
          # per <script> block can detect it.
          if ! grep -q "BreadcrumbList" dist/index.html; then
            echo "❌ BreadcrumbList schema missing from homepage"
            exit 1
          fi
          echo "✅ Homepage BreadcrumbList schema present"

          # 5. Check minimum page count
          COUNT=$(find dist -name "index.html" | wc -l)
          echo "ℹ️  Built $COUNT pages"
          if [ "$COUNT" -lt 40 ]; then
            echo "❌ Too few pages built ($COUNT) — expected 40+"
            exit 1
          fi
          echo "✅ Page count OK: $COUNT pages"

          # 6. Bundle size guard (warn > 800KB total JS)
          TOTAL_JS=$(find dist/assets -name "*.js" -exec stat --format="%s" {} + 2>/dev/null | awk '{s+=$1}END{print int(s/1024)}')
          echo "ℹ️  Total JS bundle: ${TOTAL_JS}KB"
          if [ "$TOTAL_JS" -gt 800 ]; then
            echo "⚠️  JS bundle exceeds 800KB — investigate code splitting"
          fi

          echo "── Prerender validation passed ✅ ──"

      - name: Validate JSON-LD schema syntax
        # Catches malformed structured data before it ships — a single
        # invalid JSON-LD block can get an entire page's rich results
        # dropped (Review, FAQPage, BreadcrumbList, etc.) without any
        # HTTP-level error, so this isn't caught by the checks above.
        run: |
          echo "── JSON-LD Schema Validation ──"
          node <<'EOF'
          const fs = require('fs');

          const files = [
            'dist/index.html',
            'dist/about/index.html',
            'dist/tools/rytr/index.html',
            'dist/blog/best-ai-writing-tools-2026/index.html',
            'dist/compare/rytr-vs-writesonic/index.html',
            'dist/best-ai-writing-tools/index.html',
          ];

          let failed = false;

          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.log(`❌ Missing file: ${file}`);
              failed = true;
              continue;
            }

            const html = fs.readFileSync(file, 'utf-8');
            const blocks = [...html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)];

            if (blocks.length === 0) {
              console.log(`❌ No JSON-LD schema found in ${file}`);
              failed = true;
              continue;
            }

            let blockErrors = 0;
            blocks.forEach((block, i) => {
              try {
                JSON.parse(block[1].trim());
              } catch (err) {
                console.log(`❌ Invalid JSON-LD in ${file} (block ${i + 1}): ${err.message}`);
                blockErrors++;
                failed = true;
              }
            });

            if (blockErrors === 0) {
              console.log(`✅ ${file}: ${blocks.length} valid JSON-LD block(s)`);
            }
          }

          if (failed) {
            console.log('❌ JSON-LD schema validation failed');
            process.exit(1);
          }
          console.log('✅ All JSON-LD schema blocks valid');
          EOF

      - name: Validate homepage body word count
        # GEO Task 4: catches silent homepage body injection failure. If the
        # `data-prerender="homepage"` marker scripts/prerender.mjs relies on
        # is ever renamed/stripped by a future Vite/build change, the
        # homepage regresses to ~38 words of skeleton HTML with no visible
        # build error — this guard fails the build instead of letting that
        # ship silently to production.
        run: |
          echo "── Homepage Body Word Count Guard ──"
          node <<'EOF'
          const fs = require('fs');

          const html = fs.readFileSync('dist/index.html', 'utf-8');

          // Measure only the rendered <main id="main-content"> block (not
          // <head> scripts/JSON-LD), which would otherwise mask a silent
          // injection failure by inflating the count with unrelated text.
          const mainMatch = html.match(/<main[^>]*id="main-content"[\s\S]*?<\/main>/);
          if (!mainMatch) {
            console.log('❌ <main id="main-content"> block not found in dist/index.html');
            console.log('   Homepage body injection likely failed silently — check');
            console.log('   scripts/prerender.mjs for the data-prerender="homepage" marker.');
            process.exit(1);
          }

          const text = mainMatch[0]
            .replace(/<script[\s\S]*?<\/script>/g, ' ')
            .replace(/<[^>]+>/g, ' ')
            .replace(/&[a-z]+;/gi, ' ');
          const wordCount = (text.match(/[A-Za-z0-9]+/g) || []).length;

          console.log(`ℹ️  Homepage body word count: ~${wordCount}`);
          if (wordCount < 300) {
            console.log(`❌ Homepage body has only ~${wordCount} words — expected 300+`);
            console.log('   Body injection may have silently failed. Check scripts/prerender.mjs');
            console.log('   homepage injection block and verify dist/index.html manually.');
            process.exit(1);
          }
          console.log(`✅ Homepage body word count OK (~${wordCount} words)`);
          EOF

      - name: Check for unfilled affiliate placeholders
        # If an affiliate link template (e.g. "YOUR_CODE") ever gets added
        # to constants.ts/TOOLS without the real partner ID being filled in,
        # this catches it before it ships to production.
        run: |
          echo "── Affiliate Placeholder Check ──"
          if grep -r "YOUR_CODE" dist/ 2>/dev/null; then
            echo "❌ CRITICAL: Unfilled affiliate placeholder ('YOUR_CODE') found in dist/"
            exit 1
          fi
          echo "✅ No affiliate placeholders in dist/"

      - name: Validate llms.txt sync with blog posts
        # C-04 Audit Fix: llms.txt is now auto-generated by scripts/prerender.mjs
        # from TOOLS + BLOG_POSTS arrays at build time. This step validates that
        # dist/llms.txt was generated and
        # contains entries for all blog posts and tools.
        run: |
          echo "── llms.txt Sync Validation ──"

          # 1. Verify the auto-generated dist/llms.txt exists
          if [ ! -f "dist/llms.txt" ]; then
            echo "❌ dist/llms.txt is missing — prerender.mjs generateLlmsTxt() may have failed"
            echo "   Check the 'Build + Pre-render all routes' step logs above for errors."
            exit 1
          fi
          echo "✅ dist/llms.txt present in build output"

          # 2. Count /blog/ URL entries in the auto-generated dist/llms.txt
          # Exclude non-post helper modules kept in blog/.
          BLOG_FILE_COUNT=$(find blog -maxdepth 1 -name "*.ts" ! -name "index.ts" ! -name "types.ts" ! -name "loaders.ts" ! -name "metadata.ts" | wc -l | tr -d ' ')
          LLMS_BLOG_COUNT=$(grep -c "ainexustools.online/blog/" dist/llms.txt || true)
          echo "ℹ️  blog/ has $BLOG_FILE_COUNT post files"
          echo "ℹ️  dist/llms.txt lists $LLMS_BLOG_COUNT /blog/ entries"

          if [ "$LLMS_BLOG_COUNT" -lt "$BLOG_FILE_COUNT" ]; then
            echo "❌ dist/llms.txt has $LLMS_BLOG_COUNT /blog/ entries but blog/ has $BLOG_FILE_COUNT post files."
            echo "   → Fix: check that all BLOG_POSTS entries in scripts/prerender.mjs have matching slugs."
            exit 1
          fi
          echo "✅ dist/llms.txt blog entries in sync with blog/ ($LLMS_BLOG_COUNT entries)"

          # 3. Verify llms-full.txt also landed (auto-generated by generate-llms-full.mjs)
          if [ ! -f "dist/llms-full.txt" ]; then
            echo "❌ dist/llms-full.txt is missing — scripts/generate-llms-full.mjs may have failed"
            echo "   Check the 'Build + Pre-render all routes' step logs above for errors."
            exit 1
          fi
          echo "✅ dist/llms-full.txt present in build output"

          echo "── llms.txt validation passed ✅ ──"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Google and Bing of sitemap update
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://ainexustools.online/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://ainexustools.online/sitemap.xml" || true

  ping-search-engines:
    # Notify Google and Bing about sitemap updates after every deploy
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Ping Google
        run: |
          curl -sf "https://www.google.com/ping?sitemap=https://ainexustools.online/sitemap.xml" \
            && echo "Google pinged ✓" || echo "Google ping failed (non-fatal)"

      - name: Ping Bing
        run: |
          curl -sf "https://www.bing.com/ping?sitemap=https://ainexustools.online/sitemap.xml" \
            && echo "Bing pinged ✓" || echo "Bing ping failed (non-fatal)"

      - name: Ping IndexNow
        run: |
          curl -sf -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"ainexustools.online","key":"c77b73bf52984321a0009ddd249c0a20","urlList":["https://ainexustools.online/sitemap.xml"]}' \
            && echo "IndexNow pinged ✓" || echo "IndexNow ping failed (non-fatal)"
