    <!-- Google Analytics GA4
         ─ Deferred load: fires after page load to never compete with LCP.
         ─ Bot filter: US sessions with 0% engagement are likely bots; we
           exclude traffic-analysis user-agents from being counted.
         ─ Affiliate click tracking: every outbound affiliate CTA fires an
           'affiliate_click' event with tool_name and page_path dimensions.
           Mark 'affiliate_click' as a conversion in GA4 Admin → Events.
         ─ page_view for SPA navigation is fired by App.tsx navigate() —
           send_page_view:false here prevents the initial double-fire. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // ── Affiliate click tracker — call this on every affiliate CTA ────────
      // Usage: trackAffiliate('murf-ai', 'https://get.murf.ai/ilypoqhxvxsj')
      // The ToolPage and CompareArticlePage components call this automatically
      // via the window.trackAffiliate hook below.
      window.trackAffiliate = function(toolName, destinationUrl) {
        if (typeof window.gtag === 'function') {
          window.gtag('event', 'affiliate_click', {
            tool_name: toolName,
            page_path: window.location.pathname,
            destination_url: destinationUrl,
            // GA4 treats this as a conversion once marked in Admin → Events
          });
        }
        // Small delay so GA4 fires before navigation
        setTimeout(function() {
          window.open(destinationUrl, '_blank', 'noopener,noreferrer');
        }, 150);
      };

      // ── Outbound link auto-capture — catches any <a> with an affiliate URL ─
      // Covers affiliate links rendered in blog posts and compare tables that
      // don't go through the trackAffiliate() helper directly.
      document.addEventListener('click', function(e) {
        var el = e.target.closest('a[href]');
        if (!el) return;
        var href = el.getAttribute('href') || '';
        // Match known affiliate domains
        var affiliateDomains = [
          'get.murf.ai', 'try.elevenlabs.io',
          'rytr.me', 'podcastle.ai', 'ocoya.com', 'taskade.com',
          'writesonic.com', 'quillbot.com', 'frase.io', 'jasper.ai',
          'invideo.io', 'pictory.ai', 'opus.pro', 'descript.com',
          'leonardo.ai', 'photoroom.com', 'looka.com', 'gamma.app',
          'beautiful.ai', 'notion.so', 'perplexity.ai', 'canva.com',
          'replit.com', 'grammarly.com'
        ];
        var isAffiliate = affiliateDomains.some(function(d) { return href.indexOf(d) !== -1; });
        if (isAffiliate && typeof window.gtag === 'function') {
          // Extract tool name from URL for the event label
          var toolName = affiliateDomains.find(function(d) { return href.indexOf(d) !== -1; }) || 'unknown';
          toolName = toolName.replace('.ai','').replace('.com','').replace('.io','').replace('.me','').replace('get.','').replace('try.','');
          window.gtag('event', 'affiliate_click', {
            tool_name: toolName,
            page_path: window.location.pathname,
            destination_url: href,
          });
        }
      }, true);

      window.addEventListener('load', function() {
        var delay = window.innerWidth <= 680 ? 300 : 500;
        setTimeout(function() {
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-9M7R4GGEEK';
          s.async = true;
          s.onload = function() {
            gtag('config', 'G-9M7R4GGEEK', {
              send_page_view: false,
              // Custom dimensions for richer analysis
              custom_map: {
                dimension1: 'page_type',
                dimension2: 'tool_name',
              },
            });
          };
          document.head.appendChild(s);
        }, delay);
      });
    </script>

              <div class="skeleton" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;"></div>
              <div class="skeleton" style="width:96px;height:16px;border-radius:6px;"></div>
            </div>
            <!-- Trust pill skeleton -->
            <div style="display:block;margin-bottom:14px;">
              <div class="skeleton" style="width:210px;height:26px;border-radius:100px;margin:0 auto;"></div>
            </div>
            <!-- H1 — two lines matching Fraunces heading -->
            <div class="skeleton" style="width:88%;height:52px;border-radius:10px;margin:0 auto 10px;"></div>
            <div class="skeleton" style="width:72%;height:52px;border-radius:10px;margin:0 auto 22px;"></div>
            <!-- Subtitle lines -->
            <div class="skeleton" style="width:62%;height:18px;border-radius:6px;margin:0 auto 8px;"></div>
            <div class="skeleton" style="width:48%;height:18px;border-radius:6px;margin:0 auto 28px;"></div>
            <!-- Newsletter CTA / button skeleton -->
            <div class="skeleton" style="width:260px;height:48px;border-radius:100px;margin:0 auto;"></div>
          </div>
        </div>

        <!-- ── Below-hero content: same max-width + padding as React ── -->
        <div style="max-width:1200px;margin:0 auto;padding:0 24px 48px;">

          <!-- Category filter tabs — 9 pills matching CATEGORIES array -->
          <div style="display:flex;gap:8px;padding:20px 0 4px;overflow:hidden;flex-wrap:wrap;">
            <div class="skeleton" style="width:42px;height:34px;border-radius:100px;"></div>
            <div class="skeleton" style="width:70px;height:34px;border-radius:100px;"></div>
            <div class="skeleton" style="width:56px;height:34px;border-radius:100px;"></div>
            <div class="skeleton" style="width:58px;height:34px;border-radius:100px;"></div>
            <div class="skeleton" style="width:52px;height:34px;border-radius:100px;"></div>
            <div class="skeleton" style="width:82px;height:34px;border-radius:100px;"></div>
            <div class="skeleton" style="width:60px;height:34px;border-radius:100px;"></div>
            <div class="skeleton" style="width:60px;height:34px;border-radius:100px;"></div>
            <div class="skeleton" style="width:94px;height:34px;border-radius:100px;"></div>
          </div>

          <!-- Search bar skeleton -->
          <div class="skeleton" style="width:100%;height:44px;border-radius:12px;margin:12px 0 16px;"></div>

          <!-- "X tools" label skeleton -->
          <div class="skeleton" style="width:68px;height:12px;border-radius:4px;margin-bottom:16px;"></div>

          <!-- Tool cards grid — matches React: repeat(auto-fill,minmax(300px,1fr)), gap:14 -->
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;">
            <div class="skeleton" style="height:210px;border-radius:16px;"></div>
            <div class="skeleton" style="height:210px;border-radius:16px;"></div>
            <div class="skeleton" style="height:210px;border-radius:16px;"></div>
            <div class="skeleton" style="height:210px;border-radius:16px;"></div>
            <div class="skeleton" style="height:210px;border-radius:16px;"></div>
            <div class="skeleton" style="height:210px;border-radius:16px;"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- GitHub Pages SPA routing: restore path from ?p= query param set by 404.html -->
    <script>
      (function() {
        var p = window.location.search.slice(1);
        if (p && p.startsWith('p=')) {
          var decoded = decodeURIComponent(p.slice(2));
          history.replaceState(null, null, decoded);
        }
      })();
    </script>
    <script type="module" src="/index.tsx"></script>

  </body>
