    <!-- Google Analytics GA4 — deferred until after page load so it never
         competes with LCP rendering. We buffer events that fire before the
         script arrives (e.g. page_view) using the dataLayer queue; GA4
         replays them automatically once gtag.js initialises.
         Delay: 2 000 ms after 'load' gives the LCP element time to paint
         before we hand the main thread to analytics. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9M7R4GGEEK', { send_page_view: true });

      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-9M7R4GGEEK';
          s.async = true;
          document.head.appendChild(s);
        }, 2000);
      });
    </script>

          --sh-lg:     rgba(0,0,0,.52);
          --chip-bg:   rgba(180,220,210,.08);
          color-scheme: dark;
        }
      }

      /* ── Dark mode tokens (manual toggle — wins over OS) ── */
      html[data-theme="dark"] {
        --bg:        #0C1210;
        --surf:      #141C1A;
        --surf2:     #1A2422;
        --a1:        #14B8A6;
        --a2:        #FB923C;

        --sh-lg:     rgba(0,0,0,.52);

      /* ── Light mode forced (manual toggle) ── */
      html[data-theme="light"] {
        color-scheme: light;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; scroll-behavior: smooth; }
      body { -webkit-font-smoothing: antialiased; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--txt); transition: background 0.2s, color 0.2s; }
      a { text-decoration: none; color: inherit; }
      button { font-family: inherit; cursor: pointer; border: none; background: none; }
      img, svg { display: block; }
      ::selection { background: rgba(13,148,136,0.25); }

      /* ── Mobile responsive ── */
      @media(max-width:680px){
        body { font-size:15px; }
        h1 { font-size: clamp(28px,8vw,42px) !important; }
      }
      /* ── Focus ring ── */
      :focus-visible { outline: 2px solid var(--a1); outline-offset:2px; }
      /* ── Scrollbar teal ── */
      ::-webkit-scrollbar { width:6px; height:6px; }
      ::-webkit-scrollbar-track { background:transparent; }
      ::-webkit-scrollbar-thumb { background:rgba(13,148,136,.3); border-radius:10px; }
      ::-webkit-scrollbar-thumb:hover { background:rgba(13,148,136,.55); }
    </style>
    <!-- Theme init: apply saved preference before paint to avoid flash -->
    <script>
      (function() {
  var saved = localStorage.getItem('ainexus-theme');
  var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
})();
    </script>

    <!-- Visually-hidden fallback heading for crawlers that don't execute JS.
         Uses <p> (not <h1>) so React's per-page <h1> is always the sole H1. -->
    <p role="heading" aria-level="1" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Best AI Tools for Creators — Personally Tested 2026 | AI Nexus</p>
    <div id="root"></div>
    <!-- GitHub Pages SPA routing: restore path from ?p= query param set by 404.html -->
    <script>
      (function() {
        var p = window.location.search.slice(1);
        if (p && p.startsWith('p=')) {
          var decoded = decodeURIComponent(p.slice(2));
          history.replaceState(null, null, decoded);
        }
      })();
    </script>
