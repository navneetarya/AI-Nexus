<svg viewBox="0 0 640 228" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Do you need a separate SSL?">
  <defs><linearGradient id="d0" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0D9488"/><stop offset="100%" stop-color="#0f766e"/></linearGradient></defs>
  <rect x="0" y="0" width="640" height="228" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="0" y="0" width="640" height="46" rx="16" fill="url(#d0)"/>
  <rect x="0" y="30" width="640" height="16" fill="url(#d0)"/>
  <text x="24" y="30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#ffffff">Do you need a separate SSL?</text>
  <circle cx="34" cy="87" r="4" fill="#0D9488"/><text x="50" y="92" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Host or builder includes HTTPS: usually no</text>
  <circle cx="34" cy="117" r="4" fill="#0D9488"/><text x="50" y="122" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Need wildcard or multi-domain cover: maybe</text>
  <circle cx="34" cy="147" r="4" fill="#0D9488"/><text x="50" y="152" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Need organisation or EV validation: yes</text>
  <circle cx="34" cy="177" r="4" fill="#0D9488"/><text x="50" y="182" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Confirm what is included before buying twice</text>
  <text x="28" y="210" font-family="Arial,Helvetica,sans-serif" font-size="13" font-style="italic" fill="#6b7280">SSLs.com list prices checked Sep 29</text>
