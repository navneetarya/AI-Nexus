  <circle cx="34" cy="92" r="4" fill="#D97706"/><text x="50" y="97" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Benchmarks age fast — re-verify claims each quarter</text><circle cx="34" cy="122" r="4" fill="#D97706"/><text x="50" y="127" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">&quot;Small and cheap&quot; can fail a task completely, not partly</text><circle cx="34" cy="152" r="4" fill="#D97706"/><text x="50" y="157" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Chained agents may develop behavior you didn&#x27;t design</text><circle cx="34" cy="182" r="4" fill="#D97706"/><text x="50" y="187" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">A prompting trick may work on one model size and not another</text>
