  <circle cx="34" cy="92" r="4" fill="#2563EB"/><text x="50" y="97" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">A task it used to fail outright, it now handles cleanly</text><circle cx="34" cy="122" r="4" fill="#2563EB"/><text x="50" y="127" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">The cheap tier fails completely, the paid tier nails it</text><circle cx="34" cy="152" r="4" fill="#2563EB"/><text x="50" y="157" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Vendor language shifts to &quot;reasoning&quot; or &quot;autonomous&quot;</text>
  <text x="28" y="210" font-family="Arial,Helvetica,sans-serif" font-size="13" font-style="italic" fill="#6b7280">None of these prove emergence, but they&#x27;re worth re-testing</text>
