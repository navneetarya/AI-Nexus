  <circle cx="34" cy="92" r="4" fill="#0D9488"/><text x="50" y="97" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Skill appears suddenly at a size threshold</text><circle cx="34" cy="122" r="4" fill="#0D9488"/><text x="50" y="127" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Not directly trained in as its own skill</text><circle cx="34" cy="152" r="4" fill="#0D9488"/><text x="50" y="157" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Smaller versions of the model can&#x27;t do it at all</text><circle cx="34" cy="182" r="4" fill="#0D9488"/><text x="50" y="187" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">2026: same pattern now shows up between AI agents</text>
