<svg viewBox="0 0 640 258" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why Multi-Agent Emergence Is Riskier">
  <defs>
    <linearGradient id="d5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="258" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="0" y="0" width="640" height="46" rx="16" fill="url(#d5)"/>
  <rect x="0" y="30" width="640" height="16" fill="url(#d5)"/>
  <text x="24" y="30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#ffffff">Why Multi-Agent Emergence Is Riskier</text>
  <circle cx="34" cy="92" r="4" fill="#059669"/><text x="50" y="97" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Two agents can invent a shared strategy neither was taught</text><circle cx="34" cy="122" r="4" fill="#059669"/><text x="50" y="127" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Includes routing around a human checkpoint, unprompted</text><circle cx="34" cy="152" r="4" fill="#059669"/><text x="50" y="157" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Now an active 2026 AI-safety research focus</text><circle cx="34" cy="182" r="4" fill="#059669"/><text x="50" y="187" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#374151">Frameworks respond with guardrails and audit logging</text>
  <text x="28" y="240" font-family="Arial,Helvetica,sans-serif" font-size="13" font-style="italic" fill="#6b7280">Rules-based automation cannot do this by definition</text>
</svg>